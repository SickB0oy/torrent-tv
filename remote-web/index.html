<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4F5BEF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Torrent TV">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Torrent TV</title>
<style>
:root {
  --indigo: #4F5BEF;
  --violet: #8A4DFF;
  --grad: linear-gradient(90deg, #3D7BFF, #8A4DFF);
  --bg: #F3F4FB;
  --surface: #FFFFFF;
  --ink: #181A33;
  --muted: #646887;
  --line: #E3E5F2;
  --soft: #ECEEFF;
  --done: #1E9E70;
  --paused: #A36A00;
  --error: #D63B40;
  --track: #E6E8F6;
  --stroke: 8px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12142A;
    --surface: #1A1D38;
    --ink: #ECEDF8;
    --muted: #9A9EC0;
    --line: #2A2E52;
    --soft: #23274A;
    --done: #3CCB95;
    --paused: #E3AC4C;
    --error: #FF6B70;
    --track: #2A2E52;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.45 ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-variant-numeric: tabular-nums;
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; border-radius: 10px; }

/* ---------- Header: the live speed is the hero ---------- */
.top {
  padding: calc(18px + env(safe-area-inset-top)) 20px 18px;
  max-width: 880px; margin: 0 auto;
}
.brand { display: flex; align-items: center; gap: 12px; }
.tile { width: 36px; height: 36px; flex: none; border-radius: 10px; }
.brand-name { font-weight: 700; font-size: 17px; }
.brand-sub { color: var(--muted); font-size: 13px; }
.brand-sub.bad { color: var(--error); }
.brand .spacer { flex: 1; }
.icon-btn {
  border: 0; background: var(--soft); width: 40px; height: 40px; border-radius: 12px;
  display: inline-grid; place-items: center; color: var(--ink);
}
.icon-btn svg { width: 20px; height: 20px; }

.speed { display: flex; align-items: flex-end; gap: 28px; margin-top: 22px; flex-wrap: wrap; }
.speed-main { display: flex; align-items: baseline; gap: 10px; }
.speed-value { font-size: clamp(44px, 12vw, 64px); font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
.speed-unit { font-size: 20px; font-weight: 700; color: var(--muted); }
.speed-dir { width: 30px; height: 30px; align-self: center; }
.speed-side { color: var(--muted); font-size: 14px; display: grid; gap: 2px; padding-bottom: 6px; }
.speed-side b { color: var(--ink); font-weight: 700; }

/* ---------- Toolbar ---------- */
.bar {
  position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.bar-in { max-width: 880px; margin: 0 auto; padding: 10px 16px; display: grid; gap: 10px; }
.bar-in > * { min-width: 0; }
.filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 7px 14px; white-space: nowrap; font-size: 14px; font-weight: 600; color: var(--muted);
}
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip .n { opacity: .65; margin-left: 4px; font-weight: 500; }
.search-row { display: flex; gap: 8px; }
.search {
  flex: 1; min-width: 0; width: 100%; border: 1px solid var(--line); background: var(--surface);
  border-radius: 12px; padding: 9px 12px;
}

/* ---------- Torrent list: rows, not cards ---------- */
main { max-width: 880px; margin: 0 auto; padding: 8px 16px 0; }
.list { list-style: none; margin: 0; padding: 0; }
.row {
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  margin: 10px 0; overflow: hidden;
}
.row-head {
  display: block; width: 100%; text-align: left; border: 0; background: none;
  padding: 16px 16px 14px;
}
.name { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; line-height: 1.3; }
.state { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--indigo); flex: none; }
.s-done .dot { background: var(--done); }
.s-paused .dot { background: var(--muted); }
.s-error .dot { background: var(--error); }
.s-check .dot { background: var(--paused); }
.state strong { color: var(--ink); font-weight: 700; }
.s-error .state strong { color: var(--error); }

/* The progress line echoes the round stroke of the logo */
.progress { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.track { flex: 1; height: var(--stroke); border-radius: 999px; background: var(--track); overflow: hidden; }
.fill { height: 100%; border-radius: 999px; background: var(--grad); width: 0; transition: width .6s ease; }
.s-done .fill { background: var(--done); }
.s-paused .fill { background: var(--muted); }
.s-error .fill { background: var(--error); }
.pct { font-weight: 800; font-size: 15px; min-width: 3.4em; text-align: right; }

.details { display: none; border-top: 1px solid var(--line); padding: 14px 16px 16px; }
.row.open .details { display: block; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px 16px; margin: 0; }
.facts div { min-width: 0; }
.facts dt { color: var(--muted); font-size: 13px; }
.facts dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.facts .wide { grid-column: 1 / -1; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 12px;
  padding: 9px 14px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 6px;
}
.btn.primary { background: var(--indigo); border-color: var(--indigo); color: #fff; }
.btn.danger { color: var(--error); }
.btn svg { width: 16px; height: 16px; }
.btn:disabled { opacity: .5; }

.empty { text-align: center; padding: 56px 20px; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-size: 18px; margin-bottom: 6px; }


/* ---------- Add button & sheet ---------- */
.fab {
  position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 6;
  border: 0; border-radius: 18px; padding: 15px 20px 15px 16px;
  background: var(--grad); color: #fff; font-weight: 800; font-size: 16px;
  display: inline-flex; align-items: center; gap: 8px;
  box-shadow: 0 10px 28px rgba(79, 91, 239, .38);
}
.fab svg { width: 22px; height: 22px; }

dialog {
  border: 0; padding: 0; background: var(--surface); color: var(--ink);
  width: min(560px, calc(100% - 24px)); border-radius: 24px;
}
dialog::backdrop { background: rgba(10, 12, 30, .55); }
.sheet { padding: 22px; }
.sheet h2 { margin: 0 0 4px; font-size: 20px; }
.sheet p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
.sheet textarea {
  width: 100%; min-height: 110px; resize: vertical; border: 1px solid var(--line); border-radius: 14px;
  padding: 12px; background: var(--bg); font-size: 14px;
}
.drop {
  margin-top: 12px; border: 2px dashed var(--line); border-radius: 14px; padding: 16px;
  text-align: center; color: var(--muted); font-size: 14px;
}
.drop label { color: var(--indigo); font-weight: 700; cursor: pointer; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.picked { margin-top: 8px; font-size: 13px; color: var(--ink); overflow-wrap: anywhere; }
.opt { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 14px; }
.opt input { width: 18px; height: 18px; accent-color: var(--indigo); }
.sheet-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

.dropzone {
  position: fixed; inset: 0; z-index: 20; display: none; place-items: center;
  background: rgba(61, 82, 255, .18); backdrop-filter: blur(3px);
}
.dropzone.on { display: grid; }
.dropzone div {
  background: var(--surface); border: 3px dashed var(--indigo); border-radius: 24px;
  padding: 36px 44px; font-weight: 800; font-size: 20px;
}

/* ---------- Settings ---------- */
.settings { width: min(620px, calc(100% - 24px)); }
.settings .sheet { max-height: calc(100vh - 48px); overflow-y: auto; }
.group { margin-top: 18px; }
.group h3 { margin: 0 0 6px; font-size: 15px; color: var(--muted); font-weight: 700; }
.set {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px 14px;
  padding: 12px 0; border-top: 1px solid var(--line);
}
.group .set:first-of-type { border-top: 0; }
.set label { font-weight: 600; }
.set small { grid-column: 1 / -1; color: var(--muted); font-size: 13px; margin-top: -4px; }
.set .inline { display: flex; align-items: center; gap: 8px; }
.set .switch, .set .inline { justify-self: end; }
.set input[type=number], .set input[type=text] {
  border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 7px 10px; width: 96px;
}
.set input[type=text] { width: 100%; grid-column: 1 / -1; }
.set select {
  border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 7px 10px; max-width: 220px;
}
.set input:disabled { opacity: .45; }
.unit { color: var(--muted); font-size: 14px; }
.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span {
  position: absolute; inset: 0; border-radius: 999px; background: var(--track); transition: background .2s;
  pointer-events: none;
}
.switch span::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s;
}
.switch input:checked + span { background: var(--indigo); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 3px solid var(--violet); outline-offset: 2px; }
.loading { color: var(--muted); padding: 24px 0; }

#toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 30;
  bottom: calc(92px + env(safe-area-inset-bottom));
  background: var(--ink); color: var(--bg); border-radius: 14px; padding: 11px 16px;
  font-size: 14px; max-width: calc(100% - 32px); display: none;
}
.offline {
  display: none; background: var(--error); color: #fff; text-align: center; font-size: 14px; padding: 8px 12px;
}

/* ---------- Tabs & tracker search ---------- */
.tabs { display: flex; gap: 4px; background: var(--soft); padding: 4px; border-radius: 14px; grid-column: 1 / -1; }
.tab {
  flex: 1; min-width: 0; border: 0; background: none; padding: 8px 4px; border-radius: 10px;
  font-weight: 700; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
[hidden] { display: none !important; }
.sstatus { color: var(--muted); font-size: 14px; padding: 10px 2px 0; }
.chip-sep { width: 1px; align-self: stretch; background: var(--line); margin: 4px 2px; }
.sortbar { display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 10px 0 2px; }
.sortbar::-webkit-scrollbar { display: none; }
.sortbar .lbl { color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .06em; margin-right: 4px; }
.sortbar button {
  border: 0; background: none; border-radius: 10px; padding: 6px 10px; white-space: nowrap;
  font-weight: 700; font-size: 14px; color: var(--muted);
}
.sortbar button[aria-pressed="true"] { background: var(--indigo); color: #fff; }
.sstatus .warn { color: var(--error); display: block; margin-top: 4px; }
.res {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  margin: 10px 0; padding: 14px 16px; list-style: none;
}
.res-title { font-weight: 700; overflow-wrap: anywhere; line-height: 1.3; }
.res-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; color: var(--muted); font-size: 14px; }
.res-meta .badge {
  background: var(--soft); color: var(--ink); border-radius: 8px; padding: 1px 8px; font-weight: 700; font-size: 13px;
}
.res-meta .seed { color: var(--done); font-weight: 700; }
.qtag { background: var(--soft); color: var(--ink); border-radius: 7px; padding: 1px 7px; font-weight: 800; font-size: 12px; }
.av { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
.av i { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.av-hi { color: var(--done); } .av-mid { color: #C98A00; } .av-low { color: #E26A2C; } .av-none { color: var(--error); }
.trk-name { font-size: 12px; font-weight: 700; opacity: .8; }
.row-tags { white-space: nowrap; }
.row-tags .qtag { font-size: 11px; vertical-align: 2px; }
.res-raw, .row-raw { color: var(--muted); font-size: 12px; margin-top: 6px; overflow-wrap: anywhere; opacity: .8; }
.res .actions { margin-top: 12px; }
#searchTrk { grid-column: 1 / -1; }
.src a.site { color: var(--indigo); font-weight: 700; font-size: 13px; text-decoration: none; white-space: nowrap; }
.res a.btn { text-decoration: none; color: var(--ink); }
.trk { border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-top: 10px; display: grid; gap: 8px; }
.trk label { font-size: 13px; color: var(--muted); font-weight: 600; display: grid; gap: 4px; }
.trk input {
  width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 10px;
}
.trk-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.trk-foot a { color: var(--indigo); font-size: 13px; font-weight: 700; }
.trk-title { font-weight: 800; font-size: 16px; }
.trk-adv summary { color: var(--muted); font-size: 13px; font-weight: 700; cursor: pointer; }
.trk-adv[open] { display: grid; gap: 8px; }
.group > small { display: block; color: var(--muted); font-size: 13px; }
.trk .keyok { color: var(--done); font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.trk .keyok button { border: 0; background: none; color: var(--indigo); font-weight: 700; padding: 0; font-size: 13px; }
.trk input.key { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.form-err { color: var(--error); font-weight: 600; font-size: 14px; margin: 14px 0 0; overflow-wrap: anywhere; }

@media (min-width: 760px) {
  .bar-in { grid-template-columns: 1fr 340px; align-items: center; }
  .fab { right: max(24px, calc(50% - 440px)); }
}
@media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>
</head>
<body>
<div class="offline" id="offline" role="status" data-i18n="offline"></div>

<header class="top">
  <div class="brand">
    <svg class="tile" viewBox="0 0 108 108" aria-hidden="true">
      <defs><linearGradient id="lg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="108" y2="108"><stop offset="0" stop-color="#3D7BFF"/><stop offset="1" stop-color="#8A4DFF"/></linearGradient></defs>
      <rect width="108" height="108" rx="26" fill="url(#lg)"/>
      <path d="M17,31 H47 M32,31 V76" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M57,42 V68 Q57,76 65,76 M51,53 H64 M72,53 L80.5,75 L89,53" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div>
      <div class="brand-name">Torrent TV</div>
      <div class="brand-sub" id="sub" data-i18n="connecting"></div>
    </div>
    <span class="spacer"></span>
    <button class="icon-btn" id="openSettings" data-i18n-label="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>

  <div class="speed" aria-live="polite">
    <div class="speed-main">
      <svg class="speed-dir" viewBox="0 0 24 24" fill="none" stroke="url(#lg2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <defs><linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3D7BFF"/><stop offset="1" stop-color="#8A4DFF"/></linearGradient></defs>
        <path d="M12 4v15M5.5 12.5 12 19l6.5-6.5"/>
      </svg>
      <span class="speed-value" id="downVal">0</span>
      <span class="speed-unit" id="downUnit"></span>
    </div>
    <div class="speed-side">
      <span><span data-i18n="upload"></span> <b id="up"></b></span>
      <span><span data-i18n="freeSpace"></span> <b id="free">—</b></span>
    </div>
  </div>
</header>

<div class="bar">
  <div class="bar-in">
    <div class="tabs" role="tablist">
      <button class="tab" id="tabTorrents" role="tab" aria-selected="true" data-i18n="tabTorrents"></button>
      <button class="tab" id="tabSearch" role="tab" aria-selected="false" data-i18n="tabSearch"></button>
    </div>
    <div class="filters" role="group" data-i18n-aria="filterTorrents" id="filters"></div>
    <div class="search-row" id="localSearch">
      <input class="search" id="search" type="search" data-i18n-ph="search" data-i18n-aria="searchTorrent">
    </div>
    <div class="filters" role="group" id="searchCats" hidden>
      <button class="chip" data-c="all" aria-pressed="true" data-i18n="cAll"></button>
      <button class="chip" data-c="movies" aria-pressed="false" data-i18n="cMovies"></button>
      <button class="chip" data-c="tv" aria-pressed="false" data-i18n="cTv"></button>
      <span class="chip-sep" aria-hidden="true"></span>
      <button class="chip" data-r="1080" aria-pressed="false">1080p</button>
      <button class="chip" data-r="2160" aria-pressed="false">2160p</button>
    </div>
    <form class="search-row" id="searchForm" hidden>
      <input class="search" id="sq" type="search" enterkeyhint="search" data-i18n-ph="searchPh" data-i18n-aria="tabSearch">
      <button class="btn primary" type="submit" data-i18n="go"></button>
    </form>
    <div class="filters" role="group" id="searchTrk" hidden></div>
  </div>
</div>

<main>
  <ul class="list" id="list"></ul>
  <section id="searchPanel" hidden>
    <div class="sstatus" id="sStatus" aria-live="polite"></div>
    <div class="sortbar" id="sSort" role="group" hidden></div>
    <ul class="list" id="results"></ul>
  </section>
</main>


<button class="fab" id="openAdd">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  <span data-i18n="add"></span>
</button>

<dialog id="addDlg" aria-labelledby="addTitle">
  <form class="sheet" id="addForm" method="dialog" novalidate>
    <h2 id="addTitle" data-i18n="addTitle"></h2>
    <p data-i18n="addHelp"></p>
    <textarea id="links" placeholder="magnet:?xt=urn:btih:…" data-i18n-aria="linksLabel"></textarea>
    <div class="drop" id="dropArea">
      <label for="files" data-i18n="chooseFiles"></label> <span data-i18n="orDrag"></span>
      <input id="files" type="file" accept=".torrent,application/x-bittorrent" multiple>
      <div class="picked" id="picked"></div>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn" id="cancelAdd" data-i18n="cancel"></button>
      <button type="submit" class="btn primary" id="submitAdd" data-i18n="add"></button>
    </div>
  </form>
</dialog>

<dialog id="delDlg" aria-labelledby="delTitle">
  <div class="sheet">
    <h2 id="delTitle" data-i18n="delTitle"></h2>
    <p id="delName"></p>
    <label class="opt"><input type="checkbox" id="delFiles"> <span data-i18n="delFiles"></span></label>
    <div class="sheet-actions">
      <button type="button" class="btn" id="delCancel" data-i18n="cancel"></button>
      <button type="button" class="btn primary" id="delOk" style="background:var(--error);border-color:var(--error)" data-i18n="remove"></button>
    </div>
  </div>
</dialog>

<dialog id="setDlg" class="settings" aria-labelledby="setTitle">
  <form class="sheet" id="setForm" method="dialog" novalidate>
    <h2 id="setTitle" data-i18n="settings"></h2>
    <p data-i18n="setHelp"></p>
    <section class="group">
      <div class="set">
        <label for="langSel" data-i18n="language"></label>
        <select id="langSel">
          <option value="" data-i18n="langAuto"></option>
          <option value="fr">Français</option>
          <option value="en">English</option>
          <option value="de">Deutsch</option>
        </select>
      </div>
    </section>
    <section class="group">
      <h3 data-i18n="gAll"></h3>
      <div class="actions">
        <button type="button" class="btn" id="pauseAll" data-i18n="pauseAll"></button>
        <button type="button" class="btn" id="resumeAll" data-i18n="resumeAll"></button>
      </div>
    </section>
    <div id="setBody" class="loading"></div>
    <section class="group">
      <h3 data-i18n="gTrackers"></h3>
      <small data-i18n="trkHelp"></small>
      <div id="trkList"></div>
      <div class="actions"><button type="button" class="btn" id="trkAdd" data-i18n="trkAdd"></button></div>
    </section>
    <p class="form-err" id="setErr" role="alert" hidden></p>
    <div class="sheet-actions">
      <button type="button" class="btn" id="setCancel" data-i18n="cancel"></button>
      <button type="submit" class="btn primary" id="setSave" data-i18n="save"></button>
    </div>
  </form>
</dialog>

  function browserLang() {
    var langs = navigator.languages || [navigator.language || "en"];
    for (var i = 0; i < langs.length; i++) {
      var l = String(langs[i]).slice(0, 2).toLowerCase();
      if (STR[l]) return l;
    }
    return "en";
  }
  var lang = STR[chosenLang] ? chosenLang : browserLang();

  function t(key) {
    var s = (STR[lang] && STR[lang][key]) || STR.en[key] || key;
    for (var i = 1; i < arguments.length; i++) s = s.split("{" + (i - 1) + "}").join(arguments[i]);
    return s;
  }

  function applyStatic() {
    document.documentElement.lang = lang;
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (el) {
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-label]"), function (el) {
      var s = t(el.getAttribute("data-i18n-label"));
      el.title = s; el.setAttribute("aria-label", s);
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-aria]"), function (el) {
      el.setAttribute("aria-label", t(el.getAttribute("data-i18n-aria")));
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-ph]"), function (el) {
      el.placeholder = t(el.getAttribute("data-i18n-ph"));
    });
    document.getElementById("langSel").value = chosenLang;
  }

  /* ---------- Transmission RPC ---------- */
  var RPC = "/transmission/rpc";
  var sessionId = null;

  function rpc(method, args) {
    var attempt = function (retry) {
      var headers = { "Content-Type": "application/json" };
      if (sessionId) headers["X-Transmission-Session-Id"] = sessionId;
      return fetch(RPC, {
        method: "POST", headers: headers, credentials: "same-origin",
        body: JSON.stringify({ method: method, arguments: args || {} })
      }).then(function (r) {
        // 409 = new session id required: store it and send the request again
        if (r.status === 409 && retry) {
          sessionId = r.headers.get("X-Transmission-Session-Id");
          return attempt(false);
        }
        if (r.status === 401) { var e401 = new Error(t("unauthorized")); e401.auth = true; throw e401; }
        if (!r.ok) throw new Error(t("error", r.status));
        return r.json().then(function (j) {
          if (j.result !== "success") throw new Error(j.result || t("unknownError"));
          return j.arguments || {};
        });
      });
    };
    return attempt(true);
  }

  /* ---------- Torrent TV commands (tracker search, on the device) ---------- */
  var ERR = { AUTH: "eAuth", TIMEOUT: "eTimeout", EXPIRED: "eExpired", NOT_TORRENT: "eNotTorrent" };
  function errText(m) { return ERR[m] ? t(ERR[m]) : m; }
  function ttv(path, body, timeoutMs) {
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, timeoutMs || 45000) : null;
    return fetch(path, {
      method: "POST", credentials: "same-origin", signal: ctl ? ctl.signal : undefined,
      headers: { "Content-Type": "application/json", "X-TTV": "1" },
      body: JSON.stringify(body || {})
    }).then(function (r) {
      if (r.status === 401) throw new Error(t("unauthorized"));
      if (!r.ok) throw new Error(t("error", r.status));
      return r.json();
    }).then(function (j) {
      if (timer) clearTimeout(timer);
      if (j.error) throw new Error(errText(j.error));
      return j;
    }, function (e) {
      if (timer) clearTimeout(timer);
      if (e && e.name === "AbortError") throw new Error(t("eTimeout"));
      throw e;
    });
  }

  var LANGS = { MULTI: "MULTi", VOSTFR: "VOSTFR", VOST: "VOST", FRENCH: "VF", TRUEFRENCH: "VFF", VFF: "VFF",
    VFQ: "VFQ", VF: "VF", VFI: "VF", VOF: "VOF", SUBFRENCH: "VOSTFR", VO: "VO" };
  var RX_JUNK = /^(web|web-?dl|webrip|bluray|blu-ray|bdrip|brrip|remux|hdtv|hdrip|dvdrip|dvd|hdlight|4klight|light|mhd|hdr|hdr10|dv|dolby|atmos|x264|x265|h264|h265|hevc|avc|aac|ac3|eac3|dts|ddp|dd|truehd|flac|opus|10bit|8bit|proper|repack|complete|integrale|intégrale|internal|custom|extended|unrated|imax|repost)$/i;
  function prettyName(raw) {
    var name = String(raw || "").replace(/\.(mkv|mp4|avi|ts|m4v)$/i, "");
    // dots between letters are separators, keep "5.1" or "2.0"
    // keep "5.1" or "2.0" (audio), split everything else on dots
    var words = name.replace(/(^|\D)(\d)\.(\d)(?=\D|$)/g, "$1$2\u0001$3").replace(/[._]+/g, " ")
      .replace(/\u0001/g, ".").replace(/\s+/g, " ").trim().split(" ");
    var title = [], ep = "", year = "", tags = [], seenTag = {}, stop = false;
    for (var i = 0; i < words.length; i++) {
      var w = words[i].replace(/^[\[(]+|[\])]+$/g, ""), up = w.toUpperCase().replace(/-.*$/, "");
      if (!w) continue;
      // "Blade Runner 2049 2017": the first of two years belongs to the title
      var nextYear = i + 1 < words.length && RX_YEAR.test(words[i + 1]);
      var isEp = RX_EP.test(w), isYear = RX_YEAR.test(w) && title.length > 0 && !(nextYear && !stop), isRes = RX_RES.test(w),
          lang = LANGS[up], junk = RX_JUNK.test(w.replace(/-.*$/, ""));
      if (!stop && (isEp || isYear || isRes || lang || junk)) stop = true;
      if (!stop) { title.push(w); continue; }
      if (isEp && !ep) ep = w.toUpperCase();
      else if (isYear && !year) year = w;
      else if (isRes) { var r = /2160p|4k|uhd/i.test(w) ? "4K" : w.toLowerCase(); if (!seenTag[r]) { seenTag[r] = 1; tags.push(r); } }
      else if (lang && !seenTag[lang]) { seenTag[lang] = 1; tags.push(lang); }
      else if (/^hdr/i.test(w) && !seenTag.HDR) { seenTag.HDR = 1; tags.push("HDR"); }
    }
    var t2 = title.join(" ").replace(/\s*-\s*$/, "");
    if (!t2) t2 = String(raw);
    return { title: t2, ep: ep, year: year, tags: tags };
  }
  function prettyTitle(p) {
    return p.title + (p.ep ? " — " + p.ep : "") + (p.year ? " (" + p.year + ")" : "");
  }
  function tagChips(p) {
    return p.tags.map(function (x) { return '<span class="qtag">' + esc(x) + '</span>'; }).join("");
  }

  // Seeders -> availability a beginner understands
  function availability(seeders) {
    if (seeders == null || seeders < 0) return null;
    if (seeders >= 20) return { cls: "av-hi", key: "avHigh" };
    if (seeders >= 5) return { cls: "av-mid", key: "avMid" };
    if (seeders >= 1) return { cls: "av-low", key: "avLow" };
    return { cls: "av-none", key: "avNone" };
  }
  function ago(ts) {
    if (!ts) return "";
    var d = Math.round((Date.now() / 1000 - ts) / 60), rtf;
    try { rtf = new Intl.RelativeTimeFormat(LOCALES[lang], { numeric: "auto" }); } catch (e) { return date(ts); }
    if (d < 60) return rtf.format(-Math.max(1, d), "minute");
    if (d < 1440) return rtf.format(-Math.round(d / 60), "hour");
    if (d < 43200) return rtf.format(-Math.round(d / 1440), "day");
    return date(ts);
  }

  /* ---------- Formatting ---------- */
  function sizeParts(b) {
    if (b == null || b < 0) return ["—", ""];
    var u = lang === "fr" ? ["o", "Ko", "Mo", "Go", "To"] : ["B", "KB", "MB", "GB", "TB"], i = 0;
    while (b >= 1000 && i < u.length - 1) { b /= 1024; i++; }
    var n = i === 0 ? String(Math.round(b)) : b.toFixed(b < 10 ? 1 : 0);
    if (lang !== "en") n = n.replace(".", ",");
    return [n, u[i]];
  }
  function unit0() { return lang === "fr" ? "o" : "B"; }
  function size(b) { var p = sizeParts(b); return p[1] ? p[0] + " " + p[1] : p[0]; }
  function speed(b) { var p = sizeParts(b || 0); return p[0] + " " + (p[1] || unit0()) + "/s"; }
  function kbs() { return lang === "fr" ? "Ko/s" : "KB/s"; }
  function eta(s) {
    if (s == null || s < 0) return null;
    if (s < 60) return t("lessMinute");
    var m = Math.floor(s / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
    if (d > 0) return d + " " + t("dShort") + " " + (h % 24) + " " + t("hShort");
    if (h > 0) return h + " " + t("hShort") + " " + (m % 60) + " " + t("minShort");
    return m + " " + t("minShort");
  }
  function date(ts) {
    if (!ts) return "—";
    return new Date(ts * 1000).toLocaleString(LOCALES[lang], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  }
  function pctText(p) {
    var s = String(p);
    return (lang === "en" ? s + "%" : s.replace(".", ",") + " %");
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ---------- State model ---------- */
  // Transmission status: 0 stopped, 1 queued to check, 2 checking,
  // 3 queued to download, 4 downloading, 5 queued to seed, 6 seeding
  function describe(x) {
    var pct = Math.floor((x.percentDone || 0) * 1000) / 10;
    if (x.error > 0) return { cls: "s-error", label: t("stError"), detail: x.errorString || "", group: "error", pct: pct };
    if (x.status === 1 || x.status === 2) {
      return { cls: "s-check", label: t("stCheck"), detail: x.recheckProgress ? pctText(Math.round(x.recheckProgress * 100)) : "", group: "active", pct: pct };
    }
    if (x.status === 0) {
      if (x.percentDone >= 1) return { cls: "s-done", label: t("stDone"), detail: "", group: "done", pct: pct };
      return { cls: "s-paused", label: t("stPaused"), detail: "", group: "paused", pct: pct };
    }
    if (x.status === 3) return { cls: "", label: t("stQueued"), detail: "", group: "active", pct: pct };
    if (x.status === 4) {
      if (x.metadataPercentComplete != null && x.metadataPercentComplete < 1) {
        return { cls: "", label: t("stMeta"), detail: t("nPeers", x.peersConnected), group: "active", pct: pct };
      }
      var e = eta(x.eta);
      return { cls: "", label: speed(x.rateDownload), detail: e ? t("left", e) : "", group: "active", pct: pct };
    }
    if (x.status === 5 || x.status === 6) return { cls: "s-done", label: t("stSeeding"), detail: x.rateUpload > 0 ? t("sent", speed(x.rateUpload)) : "", group: "done", pct: pct };
    return { cls: "", label: "—", detail: "", group: "active", pct: pct };
  }

  var FILTERS = [
    ["all", "fAll"], ["active", "fActive"], ["done", "fDone"], ["paused", "fPaused"], ["error", "fErrors"]
  ];
  var FIELDS = ["id", "name", "status", "percentDone", "rateDownload", "rateUpload", "eta", "totalSize",
    "sizeWhenDone", "leftUntilDone", "peersConnected", "peersSendingToUs", "uploadRatio", "error",
    "errorString", "addedDate", "doneDate", "metadataPercentComplete", "downloadDir", "uploadedEver",
    "downloadedEver", "recheckProgress", "hashString"];

  var torrents = [];
  var lastStats = {};
  var online = null;
  var filter = "all";
  var open = {};
  var downloadDir = null;

  var listEl = document.getElementById("list");
  var filtersEl = document.getElementById("filters");

  try { filter = localStorage.getItem("bbp.filter") || "all"; } catch (e) {}

  function renderFilters() {
    var counts = { all: torrents.length, active: 0, done: 0, paused: 0, error: 0 };
    torrents.forEach(function (x) { counts[describe(x).group]++; });
    filtersEl.innerHTML = FILTERS.filter(function (f) { return f[0] !== "error" || counts.error > 0; }).map(function (f) {
      return '<button class="chip" data-f="' + f[0] + '" aria-pressed="' + (filter === f[0]) + '">' + t(f[1]) +
        '<span class="n">' + counts[f[0]] + '</span></button>';
    }).join("");
  }

  // Most recently added first
  function sorted(list) {
    return list.slice().sort(function (a, b) { return b.addedDate - a.addedDate; });
  }

  function renderList() {
    var q = searchEl.value.trim().toLowerCase();
    var shown = sorted(torrents.filter(function (x) {
      if (filter !== "all" && describe(x).group !== filter) return false;
      return !q || x.name.toLowerCase().indexOf(q) >= 0;
    }));

    if (!torrents.length) {
      listEl.innerHTML = '<li class="empty"><b>' + esc(t("emptyT")) + '</b>' + esc(t("emptyD")) + '</li>';
      return;
    }
    if (!shown.length) {
      listEl.innerHTML = '<li class="empty"><b>' + esc(t("emptyFT")) + '</b>' + esc(t("emptyFD")) + '</li>';
      return;
    }

    listEl.innerHTML = shown.map(function (x) {
      var d = describe(x);
      var paused = x.status === 0;
      var isOpen = !!open[x.id];
      return '<li class="row ' + d.cls + (isOpen ? " open" : "") + '" data-id="' + x.id + '">' +
        '<button class="row-head" aria-expanded="' + isOpen + '">' +
          '<div class="name">' + esc(x.name) + '</div>' +
          '<div class="state"><span class="dot"></span><strong>' + esc(d.label) + '</strong>' +
            (d.detail ? '<span>' + esc(d.detail) + '</span>' : '') + '</div>' +
          '<div class="progress"><div class="track"><div class="fill" style="width:' + Math.min(100, d.pct) + '%"></div></div>' +
            '<span class="pct">' + pctText(d.pct) + '</span></div>' +
        '</button>' +
        '<div class="details">' +
          '<dl class="facts">' +
            '<div><dt>' + t("size") + '</dt><dd>' + size(x.sizeWhenDone || x.totalSize) + '</dd></div>' +
            '<div><dt>' + t("remaining") + '</dt><dd>' + size(x.leftUntilDone) + '</dd></div>' +
            '<div><dt>' + t("added") + '</dt><dd>' + date(x.addedDate) + '</dd></div>' +
            '<div class="wide"><dt>' + t("folder") + '</dt><dd>' + esc(x.downloadDir || "—") + '</dd></div>' +
            (x.error > 0 ? '<div class="wide"><dt>' + t("stError") + '</dt><dd>' + esc(x.errorString) + '</dd></div>' : '') +
          '</dl>' +
          '<div class="actions">' +
            (paused
              ? '<button class="btn primary" data-act="start">' + t("resume") + '</button>'
              : '<button class="btn" data-act="stop">' + t("pause") + '</button>') +
            '<button class="btn danger" data-act="remove">' + t("remove") + '</button>' +
          '</div>' +
        '</div>' +
      '</li>';

  }

  /* ---------- Header ---------- */
  function renderSpeeds(stats) {
    var p = sizeParts(stats.downloadSpeed || 0);
    document.getElementById("downVal").textContent = p[0];
    document.getElementById("downUnit").textContent = (p[1] || unit0()) + "/s";
    document.getElementById("up").textContent = speed(stats.uploadSpeed || 0);
    document.getElementById("free").textContent = freeBytes == null ? "—" : size(freeBytes);
  }

  var subEl = document.getElementById("sub");
  var offlineEl = document.getElementById("offline");
  var offlineMsg = null;
  function setOnline(ok, msg) {
    online = ok;
    offlineMsg = msg || null;
    offlineEl.style.display = ok ? "none" : "block";
    offlineEl.textContent = offlineMsg || t("offline");
    subEl.classList.toggle("bad", !ok);
  }
  function renderSub() {
    if (online === null) { subEl.textContent = t("connecting"); return; }
    if (!online) { subEl.textContent = t("offlineSub"); return; }
    var active = torrents.filter(function (x) { return x.status === 4; }).length;
    subEl.textContent = (torrents.length === 1 ? t("torrents1") : t("torrentsN", torrents.length)) +
      (active ? ", " + t("downloadingN", active) : "");
  }

  function renderAll() {
    renderSpeeds(lastStats);
    renderSub();
    renderFilters();
    renderList();
  }

  /* ---------- Polling ---------- */
  var busy = false;
  function refresh() {
    if (busy) return Promise.resolve();
    busy = true;
    return Promise.all([
      rpc("torrent-get", { fields: FIELDS }),
      rpc("session-stats")
    ]).then(function (res) {
      torrents = res[0].torrents || [];
      lastStats = res[1] || {};
      setOnline(true);
      renderAll();
    }).catch(function (e) {
      setOnline(false, e.auth ? e.message : null);
      renderSub();
    }).then(function () { busy = false; });
  }

  function refreshSession() {
    rpc("session-get").then(function (s) {
      downloadDir = s["download-dir"];
      if (s["download-dir-free-space"] != null) {
        freeBytes = s["download-dir-free-space"];
        renderSpeeds(lastStats);
      } else if (downloadDir) {
        return rpc("free-space", { path: downloadDir }).then(function (f) {
          freeBytes = f["size-bytes"];
          renderSpeeds(lastStats);

      }

  }

  /* ---------- Toast ---------- */

  /* ---------- Events ---------- */

  });
  searchEl.addEventListener("input", renderList);

  var pendingDelete = null;
  listEl.addEventListener("click", function (e) {
    var row = e.target.closest(".row");
    if (!row) return;
    var id = Number(row.getAttribute("data-id"));
    var actBtn = e.target.closest("[data-act]");
    if (!actBtn) {
      if (e.target.closest(".row-head")) { open[id] = !open[id]; renderList(); }
      return;
    }
    var act = actBtn.getAttribute("data-act");
    if (act === "remove") {
      var x = torrents.filter(function (y) { return y.id === id; })[0];
      pendingDelete = id;
      document.getElementById("delName").textContent = x ? x.name : "";
      document.getElementById("delFiles").checked = false;
      showDialog(delDlg);
      return;
    }
    var method = { start: "torrent-start", stop: "torrent-stop" }[act];
    var done = { start: t("doneStart"), stop: t("doneStop") }[act];
    actBtn.disabled = true;
    rpc(method, { ids: [id] }).then(function () { toast(done); return refresh(); })
      .catch(function (err) { toast(err.message); actBtn.disabled = false; });
  });

  document.getElementById("pauseAll").onclick = function () {
    rpc("torrent-stop", {}).then(function () { toast(t("allPaused")); refresh(); })
      .catch(function (err) { toast(err.message); });

  document.getElementById("resumeAll").onclick = function () {

      .catch(function (err) { toast(err.message); });

  /* Dialogs */

  var delDlg = document.getElementById("delDlg");

  /* Add */

  function readBase64(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(String(r.result).split(",")[1] || ""); };
      r.onerror = function () { reject(new Error(t("readFail", file.name))); };
      r.readAsDataURL(file);
    });
  }

  function addAll(links, files, paused) {
    var jobs = [];
    links.forEach(function (l) {
      jobs.push(rpc("torrent-add", { filename: l, paused: paused }).then(function (a) {
        var x = a["torrent-added"] || a["torrent-duplicate"];
        return { ok: true, dup: !!a["torrent-duplicate"], name: x && x.name ? x.name : l.slice(0, 40) };
      }).catch(function (e) { return { ok: false, name: l.slice(0, 40), err: e.message }; }));
    });
    files.forEach(function (f) {
      jobs.push(readBase64(f).then(function (b64) {
        return rpc("torrent-add", { metainfo: b64, paused: paused });
      }).then(function (a) {
        return { ok: true, dup: !!a["torrent-duplicate"], name: f.name };
      }).catch(function (e) { return { ok: false, name: f.name, err: e.message }; }));
    });
    return Promise.all(jobs).then(function (res) {
      var ok = res.filter(function (r) { return r.ok && !r.dup; }).length;
      var dup = res.filter(function (r) { return r.dup; }).length;
      var bad = res.filter(function (r) { return !r.ok; });
      var msg = [];
      if (ok) msg.push(ok === 1 ? t("added1") : t("addedN", ok));
      if (dup) msg.push(dup === 1 ? t("dup1") : t("dupN", dup));
      if (bad.length) msg.push(t("failed", bad.map(function (b) { return b.name + " (" + b.err + ")"; }).join(", ")));
      toast(msg.join(", ") || t("nothing"));

      return bad.length === 0;
    });
  }

  document.getElementById("addForm").addEventListener("submit", function (e) {

  /* Drag and drop anywhere on the page (computer) */

  /* ---------- Settings ---------- */

  function renderSettings(c) {

      '<section class="group"><h3>' + t("gSpeed") + '</h3>' +

          '<span></span>' + num("speed-limit-down", c["speed-limit-down"], kbs()) + '</div>' +

          '<span></span>' + num("speed-limit-up", c["speed-limit-up"], kbs()) +
          '<small>' + t("limitUpHelp") + '</small></div>' +
      '</section>' +
      '<section class="group"><h3>' + t("gTorrents") + '</h3>' +
        '<div class="set"><label for="download-dir">' + t("dlDir") + '</label><span></span>' +
          '<input type="text" id="download-dir" value="' + esc(c["download-dir"]) + '" spellcheck="false"></div>' +
        '<div class="set"><label for="start-added-torrents">' + t("startAdded") + '</label>' + sw("start-added-torrents", c["start-added-torrents"]) + '</div>' +

  document.getElementById("openSettings").onclick = function () {
    current = null;
    setBody.className = "loading";
    setBody.textContent = t("loadingSettings");
    document.getElementById("langSel").value = chosenLang;
    document.getElementById("setErr").hidden = true;
    showDialog(setDlg);
    loadTrackers();
    rpc("session-get").then(function (s) { current = s; renderSettings(s); })
      .catch(function (e) { setBody.textContent = t("readSetFail", e.message); });
  };
  document.getElementById("setCancel").onclick = function () { closeDialog(setDlg); };

  // Language applies right away, it is stored in this browser only
  document.getElementById("langSel").addEventListener("change", function () {
    chosenLang = this.value;
    try {
      if (chosenLang) localStorage.setItem("ttv.lang", chosenLang);
      else localStorage.removeItem("ttv.lang");
    } catch (e) {}
    lang = STR[chosenLang] ? chosenLang : browserLang();
    var typed = formValues();
    applyStatic();
    if (online === false) setOnline(false, offlineMsg);
    renderAll();
    if (current) renderSettings(typed || current);
    else if (setBody.className === "loading") setBody.textContent = t("loadingSettings");
    renderTrackers();
    renderResults();
  });

  document.getElementById("setForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var jobs = [];
    if (current) {
      var v = function (id) { return document.getElementById(id); };
      var n = function (id) { var x = parseFloat(String(v(id).value).replace(",", ".")); return isNaN(x) ? 0 : x; };
      var dir = v("download-dir").value.trim();
      var args = {
        "speed-limit-down-enabled": v("speed-limit-down-on").checked,
        "speed-limit-down": Math.round(n("speed-limit-down")),
        "speed-limit-up-enabled": v("speed-limit-up-on").checked,
        "speed-limit-up": Math.round(n("speed-limit-up")),
        "start-added-torrents": v("start-added-torrents").checked
      };
      if (dir) args["download-dir"] = dir;
      // Only send what changed
      var changed = {};
      Object.keys(args).forEach(function (k) { if (current[k] !== args[k]) changed[k] = args[k]; });
      if (Object.keys(changed).length) {
        jobs.push(rpc("session-set", changed).then(refreshSession));
      }
    }
    if (trkDirty) {
      var list = trackers.map(function (x) {
        return { id: x.id || "", name: (x.name || "").trim(), url: (x.url || "").trim(), key: (x.key || "").trim() };
      });
      jobs.push(ttv("/ttv/trackers/set", { trackers: list }).then(function (r) {
        trackers = (r.trackers || []).map(function (x) { x.key = ""; return x; });
        trkDirty = false;
      }).catch(function (err) { throw new Error(t("trkFail", err.message)); }));
    }
    if (!jobs.length) { closeDialog(setDlg); toast(t("noChange")); return; }
    var btn = document.getElementById("setSave");
    var errEl = document.getElementById("setErr");
    errEl.hidden = true;
    btn.disabled = true;
    btn.textContent = t("saving");
    Promise.all(jobs).then(function () {
      closeDialog(setDlg);
      toast(t("saved"));
    }).catch(function (err) {
      // Shown in the window: a toast would be hidden behind it
      errEl.textContent = t("saveFail", err.message);
      errEl.hidden = false;
      errEl.scrollIntoView({ block: "nearest" });
    }).then(function () { btn.disabled = false; btn.textContent = t("save"); });
  });

  /* ---------- Tabs ---------- */
  var mode = "torrents";
  function setMode(m) {
    var prev = mode;
    mode = m;
    var s = m !== "torrents";
    ["Torrents", "Search"].forEach(function (k) {
      document.getElementById("tab" + k).setAttribute("aria-selected",
        String(m === k.toLowerCase() || (k === "Torrents" && m === "torrents")));
    });
    filtersEl.hidden = s;
    document.getElementById("localSearch").hidden = s;
    listEl.hidden = s;
    document.getElementById("searchCats").hidden = !s;
    document.getElementById("searchForm").hidden = !s;
    document.getElementById("searchPanel").hidden = !s;
    document.getElementById("openAdd").hidden = s;
    document.getElementById("searchTrk").hidden = true;
    if (!s) return;
    if (!sResults && !sBusy) {
      // First time: show the latest releases right away
      runSearch();
    } else {
      renderResults();
    }
    if (m === "search") setTimeout(function () { document.getElementById("sq").focus(); }, 30);
  }
  document.getElementById("tabTorrents").onclick = function () { setMode("torrents"); };
  document.getElementById("tabSearch").onclick = function () { setMode("search"); };

  /* ---------- Tracker search ---------- */
  var sCat = "all";
  var sResults = null;       // last answer: { results, errors, searched }
  var sAdded = {};           // ref -> true once added
  var sBusy = false;
  var sStatus = document.getElementById("sStatus");
  var resultsEl = document.getElementById("results");

  var sRes = "";             // "" | "1080" | "2160": resolution filter
  var RX_RES_FILTER = { "1080": /(^|[^0-9])1080[pi]([^0-9]|$)/i, "2160": /(^|[^0-9])2160p([^0-9]|$)|(^|[^a-z0-9])(4k|uhd)([^a-z0-9]|$)/i };
  document.getElementById("searchCats").addEventListener("click", function (e) {
    var rb = e.target.closest("[data-r]");
    if (rb) {
      // Resolution: filters what is shown, tap again to show all
      sRes = sRes === rb.getAttribute("data-r") ? "" : rb.getAttribute("data-r");
      Array.prototype.forEach.call(this.querySelectorAll("[data-r]"), function (c) {
        c.setAttribute("aria-pressed", String(c.getAttribute("data-r") === sRes));
      });
      renderResults();
      return;
    }
    var b = e.target.closest("[data-c]");
    if (!b) return;
    sCat = b.getAttribute("data-c");
    Array.prototype.forEach.call(this.querySelectorAll("[data-c]"), function (c) {
      c.setAttribute("aria-pressed", String(c === b));
    });
    if (sResults) runSearch();
  });

  var sTracker = "";         // "" = all trackers

  function sTrackerNames() {
    if (!sResults || !sResults.results) return [];
    var seen = {};
    sResults.results.forEach(function (x) { seen[x.tracker] = true; });
    return Object.keys(seen).sort();
  }
  function renderTrackerChips() {
    var el = document.getElementById("searchTrk");
    var names = sTrackerNames();
    if (names.indexOf(sTracker) < 0) sTracker = "";
    el.hidden = true; // no per-tracker filter: one mixed list
    el.innerHTML = [""].concat(names).map(function (n) {
      return '<button class="chip" data-t="' + esc(n) + '" aria-pressed="' + (sTracker === n) + '">' +
        esc(n || t("allTrackers")) + '</button>';
    }).join("");
  }
  document.getElementById("searchTrk").addEventListener("click", function (e) {
    var b = e.target.closest(".chip");
    if (!b) return;
    sTracker = b.getAttribute("data-t");
    renderResults();
  });

  var SORTS = [
    ["seeders", "sSeeders", function (x) { return x.seeders || 0; }],
    ["date", "sRecent", function (x) { return x.date || 0; }],
    ["size", "sSize", function (x) { return x.size || 0; }]
  ];
  var sSort = "seeders", sDesc = true;
  try {
    var saved = JSON.parse(localStorage.getItem("ttv.sort") || "null");
    if (saved && SORTS.some(function (o) { return o[0] === saved.k; })) { sSort = saved.k; sDesc = !!saved.d; }
  } catch (e) {}
  function renderSortBar(show) {
    var el = document.getElementById("sSort");
    el.hidden = !show;
    if (!show) return;
    el.innerHTML = '<span class="lbl">' + esc(t("sortLbl")) + '</span>' + SORTS.map(function (o) {
      var on = o[0] === sSort;
      return '<button type="button" data-s="' + o[0] + '" aria-pressed="' + on + '">' + esc(t(o[1])) +
        (on ? (sDesc ? " ↓" : " ↑") : "") + '</button>';
    }).join("");
  }
  document.getElementById("sSort").addEventListener("click", function (e) {
    var b = e.target.closest("[data-s]");
    if (!b) return;
    var k = b.getAttribute("data-s");
    if (k === sSort) sDesc = !sDesc;
    else { sSort = k; sDesc = true; }
    try { localStorage.setItem("ttv.sort", JSON.stringify({ k: sSort, d: sDesc })); } catch (err) {}
    renderResults();
  });
  function sortList(list) {
    var key = SORTS.filter(function (o) { return o[0] === sSort; })[0][2];
    return list.sort(function (a, b) {
      var x = key(a), y = key(b);
      var c = x < y ? -1 : x > y ? 1 : 0;
      if (c === 0) c = (a.seeders || 0) - (b.seeders || 0);
      return sDesc ? -c : c;
    });
  }

  function renderResults() {
    if (sBusy) { sStatus.textContent = t("searching"); resultsEl.innerHTML = ""; renderSortBar(false); return; }
    if (!sResults) { sStatus.textContent = ""; resultsEl.innerHTML = ""; renderSortBar(false); renderTrackerChips(); return; }
    var r = sResults;
    renderTrackerChips();
    if (!r.searched) {
      renderSortBar(false);
      sStatus.innerHTML = esc(t("noTrackers")) +
        ' <button type="button" class="btn" id="goSettings">' + esc(t("openSettings")) + '</button>';
      resultsEl.innerHTML = "";
      return;
    }
    var list = r.results.filter(function (x) {
      if (sRes && !RX_RES_FILTER[sRes].test(x.title)) return false;
      return true;
    });
    sortList(list);
    renderSortBar(list.length > 1);
    var head = list.length === 0 ? t("noResults") : list.length === 1 ? t("oneResult") : t("nResults", list.length);
    if (!sQuery && list.length) head = t("latest") + " · " + head;
    var warn = (r.errors || []).map(function (e) {
      return '<span class="warn">' + esc(e.tracker) + " : " + esc(errText(e.error)) + '</span>';
    }).join("");
    sStatus.innerHTML = esc(head) + warn;
    resultsEl.innerHTML = list.map(function (x) {
      var done = !!sAdded[x.ref];
      var av = availability(x.seeders);
      return '<li class="res" data-ref="' + esc(x.ref) + '">' +
        '<div class="res-title">' + esc(x.title) + '</div>' +
        '<div class="res-meta">' +
          (av ? '<span class="av ' + av.cls + '"><i></i>' + esc(t("nSeeders", x.seeders)) + '</span>' : '') +
          (x.leechers >= 0 ? '<span>' + esc(t("nLeechers", x.leechers)) + '</span>' : '') +
          (x.size >= 0 ? '<span>' + size(x.size) + '</span>' : '') +
          (x.date ? '<span>' + esc(ago(x.date)) + '</span>' : '') +
          '<span class="trk-name">' + esc(x.tracker) + '</span>' +
        '</div>' +
        '<div class="actions">' +
          '<button class="btn primary" data-dl' + (done ? " disabled" : "") + '>' +
            esc(done ? t("addedOk") : t("download")) + '</button>' +
          (x.details ? '<a class="btn" href="' + esc(x.details) + '" target="_blank" rel="noopener noreferrer">' + esc(t("site")) + '</a>' : '') +
        '</div>' +
      '</li>';
    }).join("");
  }

  var sQuery = "";
  function runSearch() {
    var q = document.getElementById("sq").value.trim();
    sQuery = q;
    sBusy = true; renderResults();
    ttv("/ttv/search", { q: q, cat: sCat }).then(function (r) {
      sResults = r;
    }).catch(function (err) {
      sResults = { results: [], errors: [{ tracker: "Torrent TV", error: err.message }], searched: 1 };
    }).then(function () { sBusy = false; renderResults(); });
  }
  document.getElementById("searchForm").addEventListener("submit", function (e) {
    e.preventDefault();
    if (!sBusy) runSearch();
  });

  document.getElementById("searchPanel").addEventListener("click", function (e) {
    if (e.target.closest("#goSettings")) { document.getElementById("openSettings").click(); return; }
    var b = e.target.closest("[data-dl]");
    if (!b) return;
    var ref = b.closest(".res").getAttribute("data-ref");
    b.disabled = true;
    ttv("/ttv/add", { ref: ref }).then(function (r) {
      if (r.magnet) {
        return rpc("torrent-add", { filename: r.magnet }).then(function (a) {
          var x = a["torrent-added"] || a["torrent-duplicate"];
          return { added: x && x.name ? x.name : "magnet", duplicate: a["torrent-duplicate"] ? (x && x.name) : null };
        });
      }
      return r;
    }).then(function (r) {
      sAdded[ref] = true;
      toast(r.duplicate ? t("dlDup", r.duplicate) : t("dlAdded", r.added));
      renderResults();
      refresh();
    }).catch(function (err) { b.disabled = false; toast(err.message); });
  });

  /* ---------- Trackers (settings) ---------- */
  var KEY_PAGES = {
    c411: "https://c411.org/user/integrations",
    tr4ker: "https://tr4ker.net/mon-compte/parametres"
  };
  var trackers = [];
  var trkDirty = false;
  var trkList = document.getElementById("trkList");

  function renderTrackers() {
    trkList.innerHTML = trackers.map(function (x, i) {
      var page = KEY_PAGES[x.id];
      var fields = '<label>' + esc(t("trkName")) + '<input data-f="name" value="' + esc(x.name) + '" autocomplete="off"></label>' +
        '<label>' + esc(t("trkUrl")) + '<input data-f="url" type="url" value="' + esc(x.url) + '" spellcheck="false" autocomplete="off"></label>';
      return '<div class="trk" data-i="' + i + '">' +
        (page
          // Known tracker: name as a title, address hidden under "Advanced"
          ? '<div class="trk-title">' + esc(x.name) + '</div><details class="trk-adv"><summary>' + esc(t("advanced")) + '</summary>' + fields + '</details>'
          : fields) +
        (x.hasKey && !x.editKey
          ? '<div class="keyok">✓ ' + esc(t("keyOk")) + ' <button type="button" data-chg>' + esc(t("keyChange")) + '</button></div>'
          : '<label>' + esc(t("trkKey")) + '<input class="key" data-f="key" type="text" value="' + esc(x.key || "") +
            '" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="' + esc(t("keyPaste")) + '"></label>') +
        '<div class="trk-foot">' +
          (page ? '<a href="' + page + '" target="_blank" rel="noopener noreferrer">' + esc(t("whereKey")) + '</a>' : '<span></span>') +
          '<button type="button" class="btn danger" data-rm>' + esc(t("trkRemove")) + '</button>' +
        '</div>' +
      '</div>';
    }).join("");
  }
  trkList.addEventListener("input", function (e) {
    var box = e.target.closest(".trk"), f = e.target.getAttribute("data-f");
    if (!box || !f) return;
    trackers[Number(box.getAttribute("data-i"))][f] = e.target.value;
    trkDirty = true;
  });
  trkList.addEventListener("click", function (e) {
    var chg = e.target.closest("[data-chg]");
    if (chg) {
      trackers[Number(chg.closest(".trk").getAttribute("data-i"))].editKey = true;
      renderTrackers();
      return;
    }
    if (!e.target.closest("[data-rm]")) return;
    trackers.splice(Number(e.target.closest(".trk").getAttribute("data-i")), 1);
    trkDirty = true;
    renderTrackers();
  });
  document.getElementById("trkAdd").onclick = function () {
    trackers.push({ id: "", name: "", url: "", key: "", hasKey: false });
    trkDirty = true;
    renderTrackers();
    var inputs = trkList.querySelectorAll('.trk:last-child input');
    if (inputs[0]) inputs[0].focus();
  };
  function loadTrackers() {
    trkDirty = false;
    trackers = [];
    renderTrackers();
    ttv("/ttv/trackers/get").then(function (r) {
      if (trkDirty) return;
      trackers = (r.trackers || []).map(function (x) { x.key = ""; return x; });
      renderTrackers();
    }).catch(function (err) {
      var errEl = document.getElementById("setErr");
      errEl.textContent = t("trkFail", err.message);
      errEl.hidden = false;
    });
  }

  /* Start */
  applyStatic();
  renderAll();
  refresh();
  refreshSession();
  setInterval(function () { if (!document.hidden) refresh(); }, 2000);
  setInterval(function () { if (!document.hidden) refreshSession(); }, 30000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
